spring:
  datasource:
    # Druid 监控页面 & Web统计过滤器
    druid:
      stat-view-servlet: # 监控页面
        enabled: true
        url-pattern: /druid/*
        login-username: zsadmin
        login-password: zsadmin
      web-stat-filter: # Web统计过滤器
        enabled: true
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter: # 过滤器
        stat: # 统计过滤器
          enabled: true # 是否开启统计功能
          log-slow-sql: true # 是否打印慢SQL
          slow-sql-millis: 2000 # 慢SQL的毫秒数
          merge-sql: true # 是否合并SQL
      wall: # 防火墙过滤器
        config:
          multi-statement-allow: true # 是否允许一次执行多条语句，默认为false
    dynamic:
      druid:
        # 过滤器（StatFilter 详细参数由 DruidConfig.java 注入）
        filters: stat,wall # 统计过滤器 + 防火墙过滤器
        # 连接池参数
        initial-size: 10 # 初始化连接数
        min-idle: 5 # 最小空闲连接数
        max-active: 50 # 最大连接数
        test-on-borrow: true # 获取连接时检测是否可用
        validation-query: SELECT 1 # 检测连接是否有效的 SQL
        time-between-eviction-runs-millis: 60000 # 清理无效连接的间隔时间（毫秒）
        max-evictable-idle-time-millis: 300000 # 连接最大空闲时间，超时强制回收
        min-evictable-idle-time-millis: 300000 # 连接最小空闲时间，超时自动回收

        # 泄漏检测
        remove-abandoned: true # 自动回收泄露连接
        remove-abandoned-timeout: 300 # 超时阈值（秒）

        # 合并多个 DruidDataSource 的监控数据到同一个 druid 监控页
        use-global-data-source-stat: true
      enabled: true #启用动态数据源，默认true
      primary: master #设置默认的数据源或者数据源组,默认值即为master
      strict: false #严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
      grace-destroy: false #是否优雅关闭数据源，默认为false，设置为true时，关闭数据源时如果数据源中还存在活跃连接，至多等待10s后强制关闭
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://172.21.104.84:3306/zs_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: zsAdmin
          password: zsAdmin
        # 从库数据源（只读）
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://172.21.104.84:3306/zs_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: zsAdmin
          password: zsAdmin

  data:
    redis:
      host: 172.21.104.84
      port: 6379
      password: Zs@123..
      database: 0
      # 毫秒
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-wait: -1
          max-idle: 5
          min-idle: 0
